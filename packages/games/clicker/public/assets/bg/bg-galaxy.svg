<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#302b63"/>
      <stop offset="60%" stop-color="#1a1545"/>
      <stop offset="100%" stop-color="#0f0c29"/>
    </radialGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b2d8b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7b2d8b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1565c0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1565c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Nebula clouds -->
  <ellipse cx="200" cy="200" rx="160" ry="100" fill="url(#nebula1)"/>
  <ellipse cx="330" cy="300" rx="140" ry="90" fill="url(#nebula2)"/>
