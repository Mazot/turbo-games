  <circle cx="360" cy="210" r="1.2" fill="#eef" opacity="0.8"/><circle cx="450" cy="180" r="1" fill="white" opacity="0.7"/>
  <circle cx="20" cy="280" r="1.5" fill="white" opacity="0.8"/><circle cx="80" cy="300" r="1" fill="white" opacity="0.65"/>
  <circle cx="430" cy="270" r="1.3" fill="#ccf" opacity="0.8"/><circle cx="490" cy="290" r="1.6" fill="white" opacity="0.85"/>
  <circle cx="50" cy="380" r="1" fill="white" opacity="0.7"/><circle cx="130" cy="360" r="1.4" fill="white" opacity="0.8"/>
  <circle cx="380" cy="370" r="1.2" fill="#eef" opacity="0.75"/><circle cx="460" cy="350" r="1" fill="white" opacity="0.8"/>
